[project]
name = "squadron"
version = "0.1.0"
description = "A lead agent that directs a team of specialist sub-agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Youssef AMARZOU" }]
dependencies = []

[project.scripts]
squadron = "squadron.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["squadron"]
